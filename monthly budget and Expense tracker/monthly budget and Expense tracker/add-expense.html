     <h2>--- Add Expense ---</h2>
    <label for="expenseName">Expense Name:</label>
    <input type="text" id="expenseName" placeholder="Enter expense ">
    <br>
    <label for="category">Category:</label>
    <select id="category" name="category">
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Internet">Internet</option>
        <option value="Rent">Rent</option>
        <option value="Travel" >Travel </option>
        <option value="Education">Education</option>
        <option value="Gas Cylinder">Gas Cylinder</option>
        <option value="Electricity">Electricity</option>
        <option value="Medical">Medical</option>
        <option value="Shopping">Shopping</option>
    </select><br>
    <label for="amount">Amount(Rs):</label>
    <input type="number" id="amount" placeholder="00000">
    <br>
    <label for="date">Date:</label>
    <input type="date" id="date" placeholder="DD/MM/YY"><br><br>

        <button id="saveBtn">Save Expense</button>
        
    </div>
